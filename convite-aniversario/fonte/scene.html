stage.add(palm(-2.2,-1.6,3.6,-.6));stage.add(palm(2.4,-1.9,3.1,.55));

  g.scale.setScalar(s);g.position.y=s/2;shadowAll(g);return g;}

const smile=new THREE.Mesh(new THREE.TorusGeometry(.17,.03,12,32,Math.PI),M(0x5a0f3a));smile.rotation.z=Math.PI;smile.position.set(0,.03,.07);mouthG.add(smile);
// antennae
const antTips=[];
for(const s of[-1,1]){const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(s*.3,1.1,0),new THREE.Vector3(s*.45,1.45,.05),new THREE.Vector3(s*.72,1.7,0)]);
  const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,20,.04,10),blue);headG.add(tube);
  const tip=sph(.12,M(0xffe14d,{emissive:0xffb300,emissiveIntensity:.8,clearcoat:1}));tip.position.set(s*.72,1.72,0);headG.add(tip);antTips.push(tip);}
// party hat
const hatTexC=document.createElement('canvas');hatTexC.width=256;hatTexC.height=256;{const g=hatTexC.getContext('2d');g.fillStyle='#b57bff';g.fillRect(0,0,256,256);
  g.fillStyle='#ffffff';for(let i=0;i<6;i++){g.fillRect(0,i*44+10,256,14)}g.fillStyle='#ffd24d';for(let i=0;i<30;i++){g.beginPath();g.arc(rnd()*256,rnd()*256,6,0,7);g.fill()}}
const hatTex=new THREE.CanvasTexture(hatTexC);hatTex.colorSpace=THREE.SRGBColorSpace;
const hat=new THREE.Group();const cone=new THREE.Mesh(new THREE.ConeGeometry(.3,.75,40),M(0xffffff,{map:hatTex}));cone.position.y=.37;hat.add(cone);

// lei
const leiCols=[0xff5fa8,0xffd24d,0xc77dff,0xff8fc0,0x5fc8ff];
for(let i=0;i<16;i++){const a=i/16*Math.PI*2;const f=sph(.1,M(leiCols[i%5],{roughness:.6}),20);f.scale.set(1,.7,1);
  f.position.set(Math.sin(a)*.62,1.48+Math.cos(a)*0.0-(Math.cos(a)>0?.06*Math.cos(a):0),Math.cos(a)*.5);body.add(f);}
// arms
const arms=[];
for(const s of[-1,1]){const pivot=new THREE.Group();pivot.position.set(s*.62,1.25,0);body.add(pivot);
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.42,8,16),blue);arm.position.y=-.3;pivot.add(arm);

// ---------- balloons ----------
const balloons=[];const bCols=[0x5ab8ff,0xb48cff,0xff7ab8,0x4dd9c4,0x8c6bff,0xffd24d,0x7cc8ff,0xd58cff];
for(let i=0;i<10;i++){const g=new THREE.Group();const c=bCols[i%bCols.length];

  m.userData={x:(rnd()*2-1)*2.6,y:2+rnd()*3.6,z:-.5-rnd()*3,s:.35+rnd()*.45,ph:rnd()*6};scene.add(m);stars.push(m);}

const confetti=[];for(let i=0;i<180;i++){const m=new THREE.Mesh(confGeo,new THREE.MeshStandardMaterial({color:confCols[i%6],side:THREE.DoubleSide,roughness:.5}));
  m.userData={x:(rnd()*2-1)*3,z:-1+rnd()*3,v:.6+rnd()*.8,ph:rnd()*6,sp:2+rnd()*5,t0:rnd()*1.2};m.visible=false;scene.add(m);confetti.push(m);}
// ---------- hearts ----------
const hs=new THREE.Shape();hs.moveTo(0,-.35);hs.bezierCurveTo(-.05,-.25,-.45,-.05,-.4,.18);hs.bezierCurveTo(-.36,.38,-.08,.42,0,.22);hs.bezierCurveTo(.08,.42,.36,.38,.4,.18);hs.bezierCurveTo(.45,-.05,.05,-.25,0,-.35);

// sparkles (sprites)

  s.userData={x:(rnd()*2-1)*2.8,y:-.5+rnd()*6,z:-2+rnd()*3,ph:rnd()*6,f:1+rnd()*2};scene.add(s);sparks.push(s);}

// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const outBack=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const outElastic=x=>{x=clamp(x);return x===0?0:x===1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1};
const lerp=(a,b,x)=>a+(b-a)*x;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
function pop(el,t,tin,tout,dir='up'){const a=outBack(seg(t,tin,tin+.6));const o=1-ease(seg(t,tout,tout+.45));
  const yy=dir==='up'?(1-a)*120:0;const sc=lerp(.6,1,a)*lerp(1,.85,1-o);
  el.style.opacity=(clamp(a*1.6)*o).toFixed(3);el.style.transform=`translateY(${yy+(1-o)*-60}px) scale(${sc})`;}
const lines=["Oi, pessoal!","Tenho um convite <span class=hl>muito especial</span> para vocês!","Vamos comemorar um <span class=hl>aniversário</span> cheio de diversão, alegria e momentos incríveis?","Preparem-se para essa <span class=hl>festa!</span> 🎉"];
const LT=timing.lines;let curLine=-1;
const $=id=>document.getElementById(id);
const starSpans=[...document.querySelectorAll('.stars span')];

// ---------- frame ----------
window.renderAt=function(t){
  const f=Math.min(timing.mouth.length-1,Math.round(t*30));const amp=timing.mouth[f]||0;
  // phases
  const infoIn=ease(seg(t,13.4,14.4)), infoOut=ease(seg(t,25.6,26.6));
  const inInfo=infoIn*(1-infoOut);
  // stage placement
  stage.position.set(0,lerp(0,-1.35,inInfo),lerp(0,.6,inInfo));stage.scale.setScalar(lerp(1,.55,inInfo));
  // camera
  const camIntro=ease(seg(t,0,2.6));
  camera.position.set(Math.sin(t*.35)*.35,lerp(2.4,1.75,camIntro),lerp(11,9.3,camIntro)-Math.sin(seg(t,26.4,31)*Math.PI*.5)*.3);
  camera.lookAt(0,lerp(2.0,1.95,camIntro)+.25*ease(seg(t,26,27)),0);
  // hero entrance: fall from sky + bounce
  const drop=seg(t,.9,1.6);let hy=lerp(7,0,drop*drop);
  let sq=1;if(t>1.6){const k=t-1.6;hy=Math.abs(Math.sin(k*9))*Math.exp(-k*5)*.6;sq=1-Math.sin(Math.min(k*14,Math.PI))*Math.exp(-k*3)*.18;}
  // idle bounce + talking bob
  const talking=t>2.3&&t<13.2;
  let bob=Math.abs(Math.sin(t*Math.PI*2.1))*.06*(t>2.3?1:0);
  // jump on "Preparem-se" and on finale
  const jump=Math.max(Math.sin(seg(t,11.9,12.6)*Math.PI),Math.sin(seg(t,29.3,29.9)*Math.PI)*.7);
  hero.position.set(0,hy+bob+jump*.9,.4);
  hero.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));
  hero.rotation.y=Math.sin(t*.9)*.18+(1-ease(seg(t,.9,1.8)))*Math.PI*2+jump*Math.PI*2*(t<20?1:0);
  body.rotation.z=Math.sin(t*2.1*Math.PI)*.04;
  headG.rotation.x=-.08+Math.sin(t*4.2)*.05*(talking?1:0)-inInfo*.25;
  headG.rotation.z=Math.sin(t*1.7)*.07;
  // mouth
  const open=talking?amp:0;mouth.scale.set(lerp(.75,1,open),lerp(.12,.75,open),.35);tongue.visible=open>.25;smile.visible=open<.15;
  // kiss: pucker
  const kiss=Math.sin(seg(t,27.4,28.3)*Math.PI);
  if(kiss>0){mouth.scale.set(lerp(.75,.35,kiss),lerp(.12,.35,kiss),.35);smile.visible=kiss<.3;}
  // blink
  const bl=[0.5,4.6,8.9,12.6,17.3,21.8,24.9,28.8].some(b=>t>b&&t<b+.14);eyes.forEach(e=>e.scale.y=bl?.1:1);
  // happy squint on kiss
  if(kiss>.4)eyes.forEach(e=>e.scale.y=.25);
  // antennae glow wobble
  antTips.forEach((a,i)=>{a.material.emissiveIntensity=.6+.5*Math.sin(t*5+i*2);a.position.y=1.72+Math.sin(t*6+i)*.04});
  // arms
  const [L,R]=arms;let lz=-.25,rz=.25,lx=0,rx=0;
  // hello wave (both open) on "Oi pessoal"
  const hi=Math.sin(seg(t,2.3,3.8)*Math.PI);rz=lerp(rz,2.5+Math.sin(t*14)*.35,hi);lz=lerp(lz,-.9,hi);
  // open arms on "especial" and "comemorar"
  const op=Math.max(Math.sin(seg(t,4.4,6.4)*Math.PI),Math.sin(seg(t,7.0,10.9)*Math.PI)*.9);lz=lerp(lz,-1.5+Math.sin(t*6)*.15,op);rz=lerp(rz,1.5-Math.sin(t*6)*.15,op);
  const ju=Math.sin(seg(t,11.5,13.1)*Math.PI);lz=lerp(lz,-2.7,ju);rz=lerp(rz,2.7,ju);
  // info: point up with right arm, sway
  rz=lerp(rz,2.6+Math.sin(t*3)*.15,inInfo);lz=lerp(lz,-.5+Math.sin(t*3)*.2,inInfo);
  // finale wave (26.6-27.4), kiss (27.4-28.3) right hand to mouth then throw, then wave both
  const wv=Math.sin(seg(t,26.3,27.5)*Math.PI);rz=lerp(rz,2.6+Math.sin(t*15)*.4,wv);
  const k1=seg(t,27.4,27.85),k2=seg(t,27.85,28.4);
  if(t>27.4&&t<28.6){const toMouth=ease(k1)*(1-ease(k2));rz=lerp(rz,.9,toMouth);rx=lerp(0,-1.6,toMouth);
    const thr=Math.sin(k2*Math.PI);rz=lerp(rz,2.2,thr);rx=lerp(rx,-1.2,thr);}
  const bye=seg(t,28.6,31);if(bye>0){const b=Math.min(1,bye*4);rz=lerp(rz,2.5+Math.sin(t*14)*.4,b);lz=lerp(lz,-2.5-Math.sin(t*14+1)*.4,b);}
  L.rotation.set(lx,0,lz);R.rotation.set(rx,0,rz);
  feet.forEach((f,i)=>f.position.y=.14+Math.max(0,Math.sin(t*Math.PI*2.1+i*Math.PI))*.05*(t>2.3?1:0));
  // balloons rise & bob
  balloons.forEach((b,i)=>{const u=b.userData;const r=ease(seg(t,u.delay,u.delay+2.2));
    b.position.set(u.x+Math.sin(t*.8+u.ph)*.12,lerp(u.y-8,u.y,r)+Math.sin(t*1.3+u.ph)*.15+inInfo*.3,u.z);b.rotation.z=Math.sin(t*1.1+u.ph)*.12;});
  stars.forEach(s=>{const u=s.userData;const a=outBack(seg(t,.2+u.ph*.12,.9+u.ph*.12));s.scale.setScalar(u.s*a);s.position.set(u.x,u.y+Math.sin(t*1.5+u.ph)*.1,u.z);s.rotation.set(Math.sin(t+u.ph)*.3,t*1.4+u.ph,Math.sin(t*.7)*.2)});
  sparks.forEach(s=>{const u=s.userData;const tw=Math.max(0,Math.sin(t*u.f*2+u.ph));s.material.opacity=tw*tw;s.scale.setScalar(.15+.3*tw);s.position.set(u.x,u.y+t*.05%1,u.z)});
  flowers.forEach((fl,i)=>{fl.rotation.y=Math.sin(t*.8+i)*.3;fl.position.y=.13+Math.sin(t*1.6+i)*.03});
  gifts.forEach(([g],i)=>{g.position.y=g.scale.x/2+Math.max(0,Math.sin(t*Math.PI*2.1+i*1.3))*.06*(t>2.3?1:0)});
  // confetti bursts at 12.0 and 26.6
  confetti.forEach(c=>{const u=c.userData;let best=-1;for(const t0 of[0.9,12.0,29.3]){if(t>=t0+u.t0*.4&&t<t0+5)best=t0;}
    if(best<0){c.visible=false;return}const k=t-best-u.t0*.4;c.visible=true;
    c.position.set(u.x+Math.sin(k*u.sp*.5+u.ph)*.3,6.5-k*u.v*1.6,u.z);c.rotation.set(k*u.sp,k*u.sp*.7,u.ph);});
  // hearts from kiss
  hearts.forEach(h=>{const u=h.userData;const k=seg(t,28.0+u.d,30.4+u.d);h.visible=k>0&&k<1;if(!h.visible)return;
    const e=ease(k);const base=hero.getWorldPosition(new THREE.Vector3());h.position.set(base.x+.4+u.dx*e,base.y+2+u.dy*e,1.6+e*1.5);
    h.scale.setScalar(.6*outBack(seg(k,0,.25))*(1-seg(k,.8,1)));h.rotation.set(0,Math.sin(t*3+u.r)*.5,u.r*.3);});
  renderer.render(scene,camera);
  // ---------- DOM ----------
  pop($('title'),t,.35,2.2);
  let li=-1;for(let i=0;i<LT.length;i++){if(t>=LT[i][0]-.15)li=i;}
  if(li!==curLine){$('btxt').innerHTML=li>=0?lines[li]:'';curLine=li;}
  const bIn=outBack(seg(t,LT[0][0]-.2,LT[0][0]+.35)),bOut=1-ease(seg(t,13.1,13.5));
  let lineK=li>=0?outBack(seg(t,LT[li][0]-.15,LT[li][0]+.2)):0;
  $('bubble').style.opacity=(clamp(bIn*1.5)*bOut).toFixed(3);
  $('bubble').style.transform=`scale(${(lerp(.5,1,bIn)*lerp(.92,1,lineK)*lerp(.8,1,bOut)).toFixed(4)})`;
  pop($('head'),t,13.9,25.5);pop($('c1'),t,15.2,25.6);pop($('c2'),t,18.2,25.7);pop($('c3'),t,21.2,25.8);
  starSpans.forEach((s,i)=>{const a=outElastic(seg(t,21.8+i*.22,22.6+i*.22));s.style.transform=`scale(${a.toFixed(3)}) rotate(${((1-a)*-90).toFixed(1)}deg)`;});
  const pulse=1+.025*Math.sin(t*5);if(t>16&&t<25.5){$('c1').style.transform+=` scale(${pulse})`;}
  pop($('end'),t,26.6,40);
  $('flash').style.opacity=(Math.max(0,1-Math.abs(t-1.62)/.12)*.35+seg(t,30.2,31)).toFixed(3);
  $('flash').style.background=t>29?'#2b1d6b':'#fff';
};
await document.fonts.ready;
window.renderAt(0);window.ready=true;
</script></body></html>
