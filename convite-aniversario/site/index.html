const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const outBack=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const outElastic=x=>{x=clamp(x);return x===0?0:x===1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1};
const lerp=(a,b,x)=>a+(b-a)*x;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
function pop(el,t,tin,tout,dir='up'){const a=outBack(seg(t,tin,tin+.6));const o=1-ease(seg(t,tout,tout+.45));
  const yy=dir==='up'?(1-a)*120:0;const sc=lerp(.6,1,a)*lerp(1,.85,1-o);
  el.style.opacity=(clamp(a*1.6)*o).toFixed(3);el.style.transform=`translateY(${yy+(1-o)*-60}px) scale(${sc})`;}

// ---------- loop ----------
function frame(){
  const now=clock();const t=timeline();const T=t<0?0:t;
  const f=Math.min(timing.mouth.length-1,Math.round(T*30));const amp=t>=0?(timing.mouth[f]||0):0;
  const inInfo=t<0?0:ease(seg(T,13.4,14.6));
  if(t>=13.6&&!panelOn){panelOn=true;$('panel').classList.add('on');$('bar').classList.add('on');}
  stage.position.set(0,lerp(0,-1.35,inInfo),lerp(0,.6,inInfo));stage.scale.setScalar(lerp(1,.55,inInfo));
  const camIntro=t<0?0:ease(seg(T,0,2.6));
  camera.position.set(Math.sin(now*.35)*.35,lerp(2.4,1.75,camIntro),lerp(11,9.3,camIntro));
  camera.lookAt(0,lerp(2.0,1.95,camIntro),0);
  // hero entrance
  let hy=7,sq=1;if(t>=0){const drop=seg(T,.9,1.6);hy=lerp(7,0,drop*drop);if(T>1.6){const k=T-1.6;hy=Math.abs(Math.sin(k*9))*Math.exp(-k*5)*.6;sq=1-Math.sin(Math.min(k*14,Math.PI))*Math.exp(-k*3)*.18;}}
  const alive=t>2.3;const talking=t>2.3&&t<13.2;
  const bob=Math.abs(Math.sin(now*Math.PI*2.1))*.06*(alive?1:0);
  const jk=Math.max(t>=0?Math.sin(seg(T,11.9,12.6)*Math.PI):0,Math.sin(seg(now-jumpAt,0,.7)*Math.PI));
  const spin=ease(seg(now-spinAt,0,.9))*Math.PI*2*(now-spinAt<1?1:0);
  hero.position.set(0,hy+bob+jk*.9,.4);hero.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));
  hero.rotation.y=Math.sin(now*.9)*.18+(t>=0?(1-ease(seg(T,.9,1.8)))*Math.PI*2:0)+(t>=0?Math.sin(seg(T,11.9,12.6)*Math.PI)*0:0)+jk*Math.PI*2*(t<13?1:0)+spin;
  body.rotation.z=Math.sin(now*2.1*Math.PI)*.04;
  headG.rotation.x=-.08+Math.sin(now*4.2)*.05*(talking?1:0)-inInfo*.25;headG.rotation.z=Math.sin(now*1.7)*.07;
  const open=talking?amp:0;mouth.scale.set(lerp(.75,1,open),lerp(.12,.75,open),.35);tongue.visible=open>.25;smile.visible=open<.15;
  const kt=now-kissAt;const kiss=Math.sin(seg(kt,0,.9)*Math.PI);
  if(kiss>0){mouth.scale.set(lerp(.75,.35,kiss),lerp(.12,.35,kiss),.35);smile.visible=kiss<.3;}
